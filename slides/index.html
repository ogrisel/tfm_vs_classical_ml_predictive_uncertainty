## Tabular foundation models in a nutshell

- **Pretrained once** on millions of **synthetic tables**, not on our data
- **Small to medium data** (below ~10k rows): TFMs are usually **stronger** than classical models;
  the **gap often shrinks** as the number of rows grows
- **In-context learning**: `fit` only stores the training table; `predict` passes the
  **training rows and the test rows** through a transformer in one forward pass, with
  **no gradient step**
- We use the **defaults**, no tuning, with an **ensemble of 8** members
- The cost moves to **predict**: a **GPU** helps

# Point forecasts

How far is the mean or the median from the load?

## A point forecast: one number per horizon

One value for the load at *t + h*: the **median** (50% quantile) of the
quantile models, the **mean** for `hgb_mean`.

```text
MAE  = mean |y - ŷ|          in MW, the typical miss
MAPE = mean |y - ŷ| / y      in %, comparable across seasons
```

- Load swings from ~30 to ~90 GW: MAPE tells whether a miss is large *for that
  hour*, MAE what it costs in MW
- Scored per horizon (**1 h, 12 h, 24 h**) on the test rows of the **8
  walk-forward folds**, then averaged
- **Baseline**: the grid operator's own **RTE day-ahead forecast**, available at 24 h only
  (MAE 1051 MW, MAPE 2.17%)

# Probabilistic forecasts

From one number to a 90% prediction interval
---
## A 90% prediction interval from two quantiles

- Predict **quantiles** of the load instead of one value: **5%**, **50%**, **95%**
- The 5% and 95% quantiles delimit a **90% prediction interval**: the load falls
  **inside it 90%** of the time. Its **width** is the stated uncertainty

<img class="fig" style="width: 78%" alt="Median forecast and 90% prediction interval on a synthetic load curve" src="assets/prob_forecast/interval.png" />

???

- Figure: scripts/make_prob_forecast_figures.py. Synthetic curves, drawn so that
  the interval is wider at the daily peaks; 7 of 72 points fall outside, close to the
  expected 10%.
- 90% is the nominal level: "calibrated" means that the observed frequency
  matches it over many predictions, not that every point is inside.
- All the models of the study predict 5%, 50% and 95%, so that they are scored
  on exactly the same three quantiles even when they predict more (Kumo returns 999 quantiles, HGB was trained on 7 levels).

## What is a *good* probabilistic prediction?

- **Calibration**: a 90% interval contains the truth ~90% of the time
- **Sharpness**: among calibrated predictors, narrower intervals are better
- **Strictly proper scoring rules** reward both at once: *pinball loss* for quantiles
- Always evaluated on **left-out data**, here with time-ordered CV

<img class="fig" style="width: 74%" alt="Two 90% intervals on the same synthetic load curve: a flat band that covers 89% but is 16.8 GW wide, and a narrow band that is 2.3 GW wide but covers 61%" src="assets/prob_forecast/calibration_contrast.png" />

???

- Key message: coverage alone is gameable (infinitely wide intervals), width
  alone is gameable (zero width): scoring rules combine both.
- Figure: scripts/make_prob_forecast_figures.py, same synthetic curve as the
  interval slide. Left: a flat band at the marginal 5% and 95% quantiles. It
  ignores the time of day, so it covers about 90% (89% on these 72 points) but is
  wide everywhere. Right: the true median with half the true spread. It is
  narrow, but covers only 61%.
- Pinball loss (mean of the 5% and 95% levels, synthetic units): 0.48 for the flat
  band, 0.23 for the overconfident one, 0.15 for the calibrated interval of the
  previous slide. Both mistakes cost more than the calibrated, sharp interval.

---
## The pinball loss

```text
L_τ(y, q) = τ · (y - q)         if y ≥ q     (q too low)
          = (1 - τ) · (q - y)   if y < q     (q too high)
```

<img class="fig" style="width: 78%" alt="Pinball loss for tau = 5%, 50% and 95%" src="assets/prob_forecast/pinball.png" />

- Minimised by the **true τ-quantile**: rewards calibration **and** sharpness
- In **MW**; τ = 50% is half the MAE, so we average **τ = 5% and 95%**

???

- Source for the choice of levels: pareto.html and the round-2 report, "Pinball is
  the mean over the 5% and 95% levels"; the 50% level is already captured by MAE
  and MAPE.
- At τ = 5%, putting q above the truth costs 0.95 per MW, below it only 0.05:
  the loss pushes q down until 5% of the observations are below it.
- D² pinball (used in the comparison table of the case study) is the skill score
  1 - L(model) / L(constant quantile of y_true), 1 is perfect, 0 is a constant
  forecast; it is `sklearn.metrics.d2_pinball_score`.
- Figure: scripts/make_prob_forecast_figures.py.

## Pinball loss, coverage and width, 1 h

Nominal coverage 90%. Pinball loss is the mean of the 5% and 95% quantiles.

.cols[

## Takeaways

1. Foundation models, tabular (TFMs) and time series (TSFMs), are **competitive
   with a scikit-learn baseline**: the best ones **clearly beat HGB at 1 h**, but at 24 h a
   **calibrated HGB is statistically tied** with them
2. **Tabular models**, classical or foundation, can **rival the TSFMs** with **proper
   feature engineering**: the diff features alone cut HGB's 1 h pinball loss from 93 to 63 MW
3. **Calibration is not free**: raw HGB quantiles are over-confident (85% at 1 h, 76% at 24 h);
   recalibration or conformal correction fix it at about **5×** the fit time
4. Judge with **proper scoring rules**, not coverage alone
5. The price is **inference**: TFMs and TSFMs cost about 50× to 270× the
   prediction time of HGB quantile

## Critical difference diagrams

A bar joins models that the Nemenyi test cannot separate.

- Only **8 folds**, **not independent**: little power

???

- Why this is a weaker tool here: a critical difference diagram (Demsar 2006) compares
  mean ranks over independent datasets. Our 8 folds are consecutive time windows that share
  training data, and 8 is few: the Nemenyi critical difference is 3.19 ranks for 7 models
  and 8 folds (q_0.05 = 2.949), nearly half of the 1-to-7 rank range.
- The Wilcoxon-Holm alternative cannot reject anything here: with 8 folds the smallest
  two-sided exact p-value is 2/256 = 0.0078, above the Holm threshold 0.05/21 = 0.0024 for
  the 21 pairwise tests.
- Mean ranks, 1 h: Kumo-Tabular 1.62, t0-gamma 1.88, TabICL 2.50, HGB conformal 5.38, HGB
  quantile 5.50, Chronos-2 5.50, HGB recal 5.62. Friedman p < 0.001.

  shares a bar with them, while the block bootstrap puts TabICL clearly ahead of raw HGB

# Pinball loss, step by step

Bonus: estimating quantiles by gradient descent

???

- Bonus: how the quantile predictions are fitted, from a zero start. Use if asked how the pinball loss is minimized.

---
background-image: url(assets/pinball_descent/frame_01.png)
background-position: center
background-repeat: no-repeat
background-size: 100% 100%

???

- A skewed sample, 5 quantiles to estimate. Synthetic data: y = exp(0.75 z) with z standard normal, so the median is about 1 and the mean about 1.3. We want 5 numbers q such that a fraction tau = 5, 25, 50, 75 and 95% of the sample lies below q. Sorting the sample would do for a fixed sample, but a quantile regression model has to learn q(x) with gradients: we need a loss whose minimizer is the quantile.

---
background-image: url(assets/pinball_descent/frame_02.png)
background-position: center
background-repeat: no-repeat
background-size: 100% 100%

???

- The pinball loss of one observation. A single observation y = 1. Predicting too low costs tau per unit of error, predicting too high costs 1 - tau. For tau = 5% overshooting is 19 times more expensive than undershooting, which pushes q down; for 95% it is the opposite. At tau = 50% both sides cost the same: this is half the absolute error.

---
background-image: url(assets/pinball_descent/frame_03.png)
background-position: center
background-repeat: no-repeat
background-size: 100% 100%

???

- Averaged over the sample: convex, minimum at the quantile. Averaging over the 200 observations gives one convex curve per tau. Its slope at q is (share of the sample below q) - tau: it vanishes exactly when the share below q equals tau, i.e. at the sample tau-quantile. So the quantile is the minimizer. We could scan the curve; instead we only use the slope at the current q, which is what gradient descent (and the training of a model) has access to.

---
background-image: url(assets/pinball_descent/frame_04.png)
background-position: center
background-repeat: no-repeat
background-size: 100% 100%

???

- Why the curve looks smooth: zoom on the slope. Zoom on the median (50%) curve, on a window that contains 12 observations. Top row: the mean loss, bottom row: its slope, which is the share of the sample below q minus tau, i.e. the empirical CDF shifted by tau. Each observation makes the slope jump by 1/n = 0.005, so the loss has a kink there, but a kink that small is invisible at full scale: the staircase looks like a smooth curve and its integral, the loss, looks smooth too. Also note that the slope crosses zero exactly where the share below q reaches tau.

---
background-image: url(assets/pinball_descent/frame_05.png)
background-position: center
background-repeat: no-repeat
background-size: 100% 100%

???

- Start from the prediction q = 0. Initialization: q = 0 for the 5 levels, as for a model that outputs zeros. Every observation is above q, so the share below is 0 and the slope is 0 - tau = -tau: the steeper for the high quantiles. The tangent drawn on each curve shows that increasing q reduces the loss.

---
background-image: url(assets/pinball_descent/frame_06.png)
background-position: center
background-repeat: no-repeat
background-size: 100% 100%

???

- Iteration 1: step by tau. First update: nothing is below q, so every quantile moves up by eta * tau: 0.05, 0.25, 0.50, 0.75, 0.95. High quantiles take the biggest steps because they are the furthest from 0.

---
background-image: url(assets/pinball_descent/frame_07.png)
background-position: center
background-repeat: no-repeat
background-size: 100% 100%

???

- Iteration 2: the steps start to differ. Some observations are now below the 25 to 95% predictions, so the gap between the share below and tau, hence the step, shrinks. The 5% quantile still has nothing below it: it takes the same tiny step of 0.05 again. The steps are never larger than tau: the update is bounded whatever the scale of y.

---
background-image: url(assets/pinball_descent/frame_08.png)
background-position: center
background-repeat: no-repeat
background-size: 100% 100%

???

- Iteration 3: the middle quantiles settle. The 25 and 50% quantiles are within about 10% of their final value and the tangent on their curves is getting flat; the 75 and 95% quantiles are still travelling. The updates are driven by the gap between the share below q and tau: no sorting, no assumption on the distribution.

---
background-image: url(assets/pinball_descent/frame_09.png)
background-position: center
background-repeat: no-repeat
background-size: 100% 100%

???

- Iteration 10: the tails are still moving. After 10 iterations the 25, 50 and 75% quantiles are done. The 5 and 95% tails keep moving: few observations sit around them, so q has to travel across a low density region and the share below changes slowly. Better optimizers (momentum, Adam, line search) or a step size matched to the data scale speed this up.

---
background-image: url(assets/pinball_descent/frame_10.png)
background-position: center
background-repeat: no-repeat
background-size: 100% 100%

???

- Iteration 50: five quantiles, a 90% interval. After 50 iterations, the predictions match the minimizers of the mean pinball loss (the sample quantiles, hollow markers), the upper tail being the slowest to converge. The 5% and 95% quantiles delimit a 90% prediction interval. A quantile regression model does the same, with q = f(x; theta) and the gradient flowing into theta.
